{% extends "base.html" %}

{% block title %}
Registrace
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Registrace
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Uživatelské jméno
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >    
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Heslo
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Registrovat
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
