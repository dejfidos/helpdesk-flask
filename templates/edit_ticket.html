{% extends "base.html" %}

{% block title %}
Upravit ticket | IT HelpDesk
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card">

            <div class="card-header py-3">

                <h4 class="mb-0">
                    <i class="bi bi-pencil-square"></i>
                    Upravit ticket #{{ ticket.id }}
                </h4>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Název
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ ticket.title }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Popis
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="6"
                            required
                        >{{ ticket.description }}</textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Priorita
                        </label>

                        <select
                            name="priority"
                            class="form-select"
                        >

                            <option
                                value="Nízká"
                                {% if ticket.priority == "Nízká" %}selected{% endif %}
                            >
                                Nízká
                            </option>

                            <option
                                value="Střední"
                                {% if ticket.priority == "Střední" %}selected{% endif %}
                            >
                                Střední
                            </option>

                            <option
                                value="Vysoká"
                                {% if ticket.priority == "Vysoká" %}selected{% endif %}
                            >
                                Vysoká
                            </option>

                            <option
                                value="Kritická"
                                {% if ticket.priority == "Kritická" %}selected{% endif %}
                            >
                                Kritická
                            </option>

                        </select>

                    </div>


                    {% if session.get("role") in ["technician", "admin"] %}

                    <div class="mb-4">

                        <label class="form-label">
                            Stav
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option
                                value="Nový"
                                {% if ticket.status == "Nový" %}selected{% endif %}
                            >
                                Nový
                            </option>

                            <option
                                value="Řeší se"
                                {% if ticket.status == "Řeší se" %}selected{% endif %}
                            >
                                Řeší se
                            </option>

                            <option
                                value="Vyřešeno"
                                {% if ticket.status == "Vyřešeno" %}selected{% endif %}
                            >
                                Vyřešeno
                            </option>

                        </select>

                    </div>

                    {% endif %}


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-save"></i>
                            Uložit změny
                        </button>

                        <a
                            href="{{ url_for('main.ticket_detail', ticket_id=ticket.id) }}"
                            class="btn btn-outline-secondary"
                        >
                            Zrušit
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
