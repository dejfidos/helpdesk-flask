{% extends "base.html" %}

{% block title %}
Přihlášení | IT HelpDesk
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle fs-1 text-primary"></i>

                    <h2 class="mt-2">
                        Přihlášení
                    </h2>

                    <p class="text-muted">
                        Přihlaste se do IT HelpDesku
                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Uživatelské jméno
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Heslo
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        <i class="bi bi-box-arrow-in-right"></i>
                        Přihlásit
                    </button>

                </form>

                <div class="text-center mt-3">

                    <span class="text-muted">
                        Nemáte účet?
                    </span>

                    <a href="{{ url_for('main.register') }}">
                        Registrovat
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
