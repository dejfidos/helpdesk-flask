{% extends "base.html" %}

{% block title %}
Nový ticket | IT HelpDesk
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card">

            <div class="card-header py-3">

                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i>
                    Nový ticket
                </h4>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Název problému
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Např. Nefunguje tiskárna"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Popis problému
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="6"
                            placeholder="Popiš problém co nejpřesněji..."
                            required
                        ></textarea>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Priorita
                        </label>

                        <select
                            name="priority"
                            class="form-select"
                        >
                            <option value="Nízká">
                                Nízká
                            </option>

                            <option value="Střední" selected>
                                Střední
                            </option>

                            <option value="Vysoká">
                                Vysoká
                            </option>

                            <option value="Kritická">
                                Kritická
                            </option>
                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Kategorie
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required
                        >
                            <option value="Hardware">
                                Hardware
                            </option>

                            <option value="Software">
                                Software
                            </option>

                            <option value="Síť">
                                Síť
                            </option>

                            <option value="Tiskárny">
                                Tiskárny
                            </option>

                            <option value="SAP">
                                SAP
                            </option>

                            <option value="E-mail">
                                E-mail
                            </option>

                            <option value="Přístupy">
                                Přístupy
                            </option>

                            <option value="Ostatní" selected>
                                Ostatní
                            </option>
                        </select>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-check-lg"></i>
                            Vytvořit ticket
                        </button>

                        <a
                            href="{{ url_for('main.index') }}"
                            class="btn btn-outline-secondary"
                        >
                            Zrušit
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
